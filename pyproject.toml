[project]
name = "dr-rag"
version = "0.1.0"
description = "Document retrieval and question answering with language models."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dreahim" }]
dependencies = [
    "aiofiles==25.1.0",
    "fastapi==0.145.0",
    "langchain-community==0.4.2",
    "langchain-core==1.6.12",
    "langchain-text-splitters==1.1.3",
    "pydantic-settings==2.15.0",
    "PyMuPDF==1.28.2",
    "pymongo==4.19.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.54.0",
]

[project.urls]
Repository = "https://github.com/Dreahim/Dr-RAG"

[tool.uv]
package = false
required-version = ">=0.13.1"
prerelease = "disallow"
