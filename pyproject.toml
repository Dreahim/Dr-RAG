[project]
name = "dr-rag"
version = "0.1.0"
description = "Document retrieval and question answering with language models."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dreahim" }]
dependencies = [
    "fastapi==0.145.0",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.54.0",
]

[project.urls]
Repository = "https://github.com/Dreahim/Dr-RAG"

[tool.uv]
package = false
required-version = ">=0.13.1"
prerelease = "disallow"
